[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jrt0197-pipeline"
version = "0.1.0"
description = "Auditable JR/T 0197-2020 Table A.1 data pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "jsonschema==4.23.0",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.9",
  "pypdf==6.10.0",
  "PyYAML==6.0.1",
]

[dependency-groups]
dev = [
  "pytest==7.4.4",
  "reportlab==4.4.9",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jrt_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
